<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendário — Foco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Aviso de login (se abrir esta página sem estar logado) -->
  <section id="tela-deslogado" class="tela-login" hidden>
    <div class="login-caixa">
      <p class="eyebrow">preparação · concurso</p>
      <h1 class="marca">Foco<span class="ponto">.</span></h1>
      <p class="sub">Você precisa entrar primeiro.</p>
      <a class="btn-primario" href="index.html">Ir para o login</a>
    </div>
  </section>

  <!-- App -->
  <section id="tela-cal" class="app" hidden>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar">
      <div class="sb-marca">Foco<span class="ponto">.</span></div>
      <nav class="sb-nav">
        <a href="index.html" class="sb-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
          Concursos
        </a>        <a href="calendario.html" class="sb-item ativo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3M16 3v3"/></svg>
          Calendário
        </a>        <a href="materias.html" class="sb-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4 3 8l9 4 9-4-9-4Z"/><path d="M3 12l9 4 9-4M3 16l9 4 9-4"/></svg>
          Conteúdos
        </a>        <a href="atividades.html" class="sb-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
          Atividades
        </a>
        <a href="desempenho.html" class="sb-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          Desempenho
        </a>
        <a href="bancos.html" class="sb-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6.5C4 5 6 4 9 4s5 1 5 2.5M4 6.5V18c0 1.5 2 2.5 5 2.5s5-1 5-2.5m-10-11.5v0M14 6.5C14 5 16 4 19 4s1 0 1 0M20 6.5V18c0 1.5-2 2.5-5 2.5"/><path d="M14 6.5V18"/></svg>
          Bancos
        </a>        <a href="pomodoro.html" class="sb-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="13" r="8"/><path d="M12 13V8.5M9.5 3h5M18.5 6.5l1.5-1.5"/></svg>
          Pomodoro
        </a>        <a href="ementa.html" class="sb-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 4v16M5 8h5M5 14h5M13 8h6M13 14h6"/></svg>
          Ementa
        </a>      </nav>
      <div class="sb-rodape">
        <div class="sb-user">
          <b>Foco<span class="ponto">.</span></b>
          <span id="quem-sou" class="quem-sou"></span>
        </div>
        <button class="mini perigo" id="btn-sair">Sair</button>
      </div>
    </aside>

    <div class="conteudo">
      <div class="barra-mobile">
        <button class="hamb" id="hamb" aria-label="Abrir menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="marca-mini">Foco<span class="ponto">.</span></span>
      </div>

      <div class="topo-pag">
        <div>
          <h1>Calendário</h1>
          <p>Seu plano de estudos, dia a dia, com revisões espaçadas.</p>
        </div>
      </div>

      <div class="painel">
        <main class="cal-main">
          <div class="cal-cabecalho">
            <div>
              <h2 class="titulo-secao">Plano de estudos</h2>
              <p id="resumo-geral" class="resumo-geral">Carregando…</p>
            </div>
            <div class="cal-acoes">
              <button id="btn-carregar" class="btn-primario" hidden>Carregar plano do Eduardo</button>
              <button id="btn-recarregar" class="mini" hidden>Recarregar plano do zero</button>
            </div>
          </div>

          <div id="metricas" class="metricas"></div>

          <div id="lista-dias" class="lista-dias"></div>
        </main>
      </div>
    </div>
  </section>

  <script defer src="js/shell.js"></script>
  <script type="module" src="js/calendario.js"></script>
</body>
</html>
